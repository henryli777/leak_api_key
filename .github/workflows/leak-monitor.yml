name: leak-api-key-monitor

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to run: github,google"
        required: false
        default: "github,google"
      max_queries:
        description: "Max query count for this run"
        required: false
        default: "36"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'push' && 'leak-api-key-safe-tests' || 'leak-api-key-monitor' }}
  cancel-in-progress: true

jobs:
  safe-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install safe test dependencies
        run: pip install -r requirements.txt pytest
      - name: Run safe regression tests
        run: python -m pytest -q

  build:
    needs: safe-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      history_ready: ${{ steps.history.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Prepare target config
        run: |
          mkdir -p config data dist
          if [ -n "${{ secrets.TARGETS_YAML }}" ]; then
            printf "%s\n" "${{ secrets.TARGETS_YAML }}" > config/targets.yml
          elif [ ! -f config/targets.yml ]; then
            cp config/targets.example.yml config/targets.yml
          fi

      - name: Run leak monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_KEYS: ${{ secrets.SERPAPI_KEYS }}
          SERPAPI_KEY_1: ${{ secrets.SERPAPI_KEY_1 }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SERPAPI_KEY_3: ${{ secrets.SERPAPI_KEY_3 }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          PRIVATE_REPORT_USER: ${{ secrets.PRIVATE_REPORT_USER }}
          PRIVATE_REPORT_PASSWORD: ${{ secrets.PRIVATE_REPORT_PASSWORD }}
          AUTHORIZED_VALIDATION_TARGETS_JSON: ${{ secrets.AUTHORIZED_VALIDATION_TARGETS_JSON }}
        run: |
          SOURCES="${{ github.event.inputs.sources || 'github,google' }}"
          MAX_QUERIES="${{ github.event.inputs.max_queries || '36' }}"
          python main.py scan \
            --config config/targets.yml \
            --data-dir data \
            --output-dir dist \
            --sources "${SOURCES}" \
            --max-queries "${MAX_QUERIES}" \
            --notify

      - name: Add public support navigation
        run: |
          python -m unittest test_project_support -v
          python project_support.py dist

      - name: Verify public exports
        run: python main.py verify-exports --output-dir dist

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: leak-monitor-report
          path: dist
          if-no-files-found: warn

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Check optional history snapshot
        id: history
        continue-on-error: true
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          from pathlib import Path
          marker = Path('data/history-ready')
          health = json.loads(Path('dist/health.json').read_text())
          ready = marker.exists() and marker.read_text().strip() == health['build_time'] and Path('data/history/index.json').exists()
          print('ready=' + str(ready).lower())
          if not ready:
              print('::warning::History snapshot unavailable; publishing verified public report only.', file=sys.stderr)
          PY

      - name: Upload optional redacted history
        if: steps.history.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: leak-monitor-history
          path: |
            data/history
            data/last_run.json
          if-no-files-found: error

  persist-history:
    needs: build
    if: needs.build.outputs.history_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: leak-monitor-history
          path: history-snapshot
      - name: Persist bounded redacted history
        run: |
          test -f history-snapshot/history/index.json
          rm -rf data/history
          mkdir -p data/history
          cp -R history-snapshot/history/. data/history/
          cp history-snapshot/last_run.json data/last_run.json
          rm -f data/findings.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          git diff --cached --quiet || git commit -m "chore(data): update bounded redacted history [skip ci]"
          # Reject a concurrent main update; never replace newer durable history.
          git push origin HEAD:refs/heads/main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
