name: Publish public UI from verified snapshot

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Original collection run with successful public verification and report artifact upload"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: leak-api-key-monitor
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install safe UI dependencies
        run: pip install -r requirements.txt pytest
      - name: Verify original build provenance
        run: python scripts/verify_snapshot_publication.py
      - name: Download only original public artifact
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name leak-monitor-report --dir snapshot
          mv snapshot dist
      - name: Refresh public UI without refreshing data
        run: |
          python -m pytest -q
          python refresh_public_snapshot.py dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Recheck current main and latest snapshot before deployment
        run: python scripts/verify_snapshot_publication.py
      - name: Deploy original snapshot with updated public UI
        id: deployment
        uses: actions/deploy-pages@v4
