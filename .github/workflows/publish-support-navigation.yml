name: Publish public UI from verified snapshot

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Original collection run with successful public verification and report artifact upload"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: leak-api-key-monitor
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install safe UI dependencies
        run: pip install -r requirements.txt pytest
      - name: Verify original build provenance
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > source-jobs.json
          python - <<'PY'
          import json, os
          from refresh_public_snapshot import verify_source_run
          with open('source-run.json') as stream:
              run = json.load(stream)
          with open('source-jobs.json') as stream:
              jobs = json.load(stream)
          verify_source_run(run, jobs, os.environ['SOURCE_RUN_ID'])
          print('Preserving published snapshot from run', run['id'], 'commit', run['head_sha'])
          PY
      - name: Download only original public artifact
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name leak-monitor-report --dir snapshot
          mv snapshot dist
      - name: Refresh public UI without refreshing data
        run: |
          python -m pytest -q
          python refresh_public_snapshot.py dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy original snapshot with updated public UI
        id: deployment
        uses: actions/deploy-pages@v4
